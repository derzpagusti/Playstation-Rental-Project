<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101729">
    <title>
      Sign Up — NovaPS
    </title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    >
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link
      rel="stylesheet"
      href="./assets/css/shared.css"
    >
    <link
      rel="stylesheet"
      href="./assets/css/auth.css"
    >
    <script
      defer
      src="./assets/js/common.js"
    >
    </script>
    <script
      defer
      src="./assets/js/auth.js"
    >
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="./index.html">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="2.5" y="5" width="19" height="14" rx="3" stroke="currentColor" stroke-width="1.8" />
              <path d="M7 12h5M9.5 9.5v5M16.5 10.5h.01M18.5 13h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </span>
          <span>Nova<span class="brand-accent">PS</span></span>
        </a>
        <div class="nav-actions">
          <a class="btn btn-outline" href="./login.html">Login</a>
        </div>
      </div>
    </header>
    <main class="auth-main signup-main">
      <div class="auth-wrap">
        <a class="back-link" href="./index.html">← Back to Home</a>
        <section class="auth-card signup-card">
          <h1>
            Sign up
          </h1>
          <p class="auth-subtitle">
            Create your new account
          </p>
          <form data-auth="signup">
            <label class="form-field">
              Full Name<input name="name" autocomplete="name" required>
            </label>
            <label class="form-field">
              Phone Number (WA)<input name="phone" type="tel" autocomplete="tel" required>
            </label>
            <label class="form-field">
              Address<input name="address" autocomplete="street-address" required>
            </label>
            <div class="form-field">
              ID Card
              <div class="upload-box">
                <input name="idCard" type="file" accept="image/*" required><span aria-hidden="true">▧</span><small>Choose an ID card image</small>
              </div>
              <span class="field-hint">Put your ID Card here</span>
            </div>
            <label class="form-field">
              Email<input name="email" type="email" autocomplete="email" required>
            </label>
            <label class="form-field">
              Password<input name="password" type="password" autocomplete="new-password" required><span class="field-hint">Must have 8 characters &amp; number.</span>
            </label>
            <label class="form-field">
              Confirm Password<input name="confirmPassword" type="password" autocomplete="new-password" required>
            </label>
            <p class="form-error" aria-live="polite">
            </p>
            <button class="btn btn-purple auth-submit">
              Sign Up
            </button>
          </form>
          <p class="auth-bottom">
            Already have account? <a href="./login.html">Login</a>
          </p>
        </section>
      </div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite">
    </div>
  </body>
</html>
