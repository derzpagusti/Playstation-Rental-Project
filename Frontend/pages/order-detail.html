<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Detail - NovaPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/order-detail.css" />
    <script
      src="../js/shared/session.js"
      data-require-login="login.html"
    ></script>
    <script src="../js/shared/navbar.js" defer></script>
    <script src="../js/shared/orders.js" defer></script>
    <script src="../js/shared/cancel-order.js" defer></script>
    <script src="../js/shared/rental-alerts.js" defer></script>
    <script src="../js/order-detail.js" defer></script>
  </head>
  <body
    class="min-h-screen bg-slate-50 text-slate-800"
    data-logout-redirect="../index.html"
  >
    <header class="h-[68px] bg-slate-900">
      <div class="wrap flex h-full items-center justify-between">
        <a
          href="../index.html"
          aria-label="NovaPS home"
          class="group flex items-center gap-2.5 font-display text-2xl font-bold text-white transition-transform duration-150 active:scale-95"
        >
          <span
            class="grid size-[30px] place-items-center rounded-[7px] bg-cyan-400 transition-transform duration-300 ease-[cubic-bezier(.3,1.6,.5,1)] group-hover:-rotate-[8deg] group-hover:scale-110"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#0f172a"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="6" width="20" height="12" rx="3" />
              <path d="M6 12h4M8 10v4" />
              <circle cx="15.5" cy="11" r=".6" />
              <circle cx="17.5" cy="13" r=".6" />
            </svg>
          </span>
          Nova<span class="text-cyan-400">PS</span>
        </a>
        <nav
          class="flex items-center gap-1.5 sm:gap-[18px]"
          aria-label="Account"
        >
          <div class="group/tip relative">
            <a
              href="time-remaining.html"
              class="icon-btn aria-[current=page]:bg-tip"
              aria-label="Time Remaining"
              aria-describedby="tip-time"
              ><svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="10" />
                <path d="M12 6v6l4 2" /></svg
            ></a>
            <span id="tip-time" role="tooltip" class="tooltip"
              ><span class="block text-sm font-medium">Time Remaining</span
              ><span class="block text-xs text-sky-200"
                >See how much rental time is left</span
              ></span
            >
          </div>
          <div class="group/tip relative">
            <a
              href="order-status.html"
              class="icon-btn aria-[current=page]:bg-tip"
              aria-label="Order Status"
              aria-describedby="tip-orders"
              ><svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="5" y="3" width="14" height="18" rx="2" />
                <path d="M9 3h6v3H9zM9 11h6M9 15h6" /></svg
            ></a>
            <span id="tip-orders" role="tooltip" class="tooltip"
              ><span class="block text-sm font-medium">Order Status</span
              ><span class="block text-xs text-sky-200"
                >View your order history &amp; status</span
              ></span
            >
          </div>
          <div class="group group/tip relative">
            <button
              type="button"
              id="profileBtn"
              class="icon-btn w-14 border-white aria-[current=page]:bg-tip"
              aria-haspopup="true"
              aria-expanded="false"
              aria-label="My Account"
              aria-describedby="tip-account"
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
              </svg>
            </button>
            <span
              id="tip-account"
              role="tooltip"
              class="tooltip group-data-[open]:hidden"
              ><span class="block text-sm font-medium">My Account</span
              ><span class="block text-xs text-sky-200"
                >View your account details</span
              ></span
            >
            <div
              class="invisible absolute right-0 top-[50px] z-10 min-w-[140px] -translate-y-1.5 rounded-lg bg-white p-1.5 opacity-0 shadow-xl transition-all duration-200 group-data-[open]:visible group-data-[open]:translate-y-0 group-data-[open]:opacity-100"
            >
              <a
                href="account.html"
                class="block w-full rounded-md px-3 py-2 text-left text-[15px] font-medium text-slate-800 transition-colors hover:bg-slate-100"
                >My Account</a
              >
              <button
                type="button"
                id="logoutBtn"
                class="w-full cursor-pointer rounded-md px-3 py-2 text-left text-[15px] font-medium text-slate-800 transition-colors hover:bg-slate-100"
              >
                Logout
              </button>
            </div>
          </div>
        </nav>
      </div>
    </header>
    <main class="mx-auto w-[640px] max-w-[calc(100%-2rem)] pt-6 pb-16">
      <section class="rounded-lg border border-slate-200 bg-white p-6">
        <svg
          id="badge"
          viewBox="0 0 100 100"
          aria-hidden="true"
          class="mx-auto size-[130px] text-green-500 transition-colors duration-300"
        >
          <path
            d="M95.2 50.0 L94.9 51.8 L94.1 53.5 L92.9 55.1 L91.5 56.6 L90.0 58.0 L88.6 59.3 L87.6 60.6 L86.9 62.0 L86.6 63.5 L86.7 65.2 L87.0 67.1 L87.4 69.1 L87.7 71.1 L87.7 73.1 L87.4 75.0 L86.6 76.6 L85.3 77.8 L83.7 78.7 L81.7 79.3 L79.7 79.7 L77.7 79.9 L75.8 80.2 L74.2 80.7 L72.8 81.4 L71.7 82.5 L70.8 83.9 L69.9 85.6 L69.1 87.4 L68.1 89.3 L66.9 90.9 L65.6 92.2 L64.0 93.0 L62.2 93.3 L60.3 93.0 L58.4 92.4 L56.6 91.5 L54.8 90.5 L53.1 89.6 L51.5 89.0 L50.0 88.8 L48.5 89.0 L46.9 89.6 L45.2 90.5 L43.4 91.5 L41.6 92.4 L39.7 93.0 L37.8 93.3 L36.0 93.0 L34.4 92.2 L33.1 90.9 L31.9 89.3 L30.9 87.4 L30.1 85.6 L29.2 83.9 L28.3 82.5 L27.2 81.4 L25.8 80.7 L24.2 80.2 L22.3 79.9 L20.3 79.7 L18.3 79.3 L16.3 78.7 L14.7 77.8 L13.4 76.6 L12.6 75.0 L12.3 73.1 L12.3 71.1 L12.6 69.1 L13.0 67.1 L13.3 65.2 L13.4 63.5 L13.1 62.0 L12.4 60.6 L11.4 59.3 L10.0 58.0 L8.5 56.6 L7.1 55.1 L5.9 53.5 L5.1 51.8 L4.8 50.0 L5.1 48.2 L5.9 46.5 L7.1 44.9 L8.5 43.4 L10.0 42.0 L11.4 40.7 L12.4 39.4 L13.1 38.0 L13.4 36.5 L13.3 34.8 L13.0 32.9 L12.6 30.9 L12.3 28.9 L12.3 26.9 L12.6 25.0 L13.4 23.4 L14.7 22.2 L16.3 21.3 L18.3 20.7 L20.3 20.3 L22.3 20.1 L24.2 19.8 L25.8 19.3 L27.2 18.6 L28.3 17.5 L29.2 16.1 L30.1 14.4 L30.9 12.6 L31.9 10.7 L33.1 9.1 L34.4 7.8 L36.0 7.0 L37.8 6.7 L39.7 7.0 L41.6 7.6 L43.4 8.5 L45.2 9.5 L46.9 10.4 L48.5 11.0 L50.0 11.2 L51.5 11.0 L53.1 10.4 L54.8 9.5 L56.6 8.5 L58.4 7.6 L60.3 7.0 L62.2 6.7 L64.0 7.0 L65.6 7.8 L66.9 9.1 L68.1 10.7 L69.1 12.6 L69.9 14.4 L70.8 16.1 L71.7 17.5 L72.8 18.6 L74.2 19.3 L75.8 19.8 L77.7 20.1 L79.7 20.3 L81.7 20.7 L83.7 21.3 L85.3 22.2 L86.6 23.4 L87.4 25.0 L87.7 26.9 L87.7 28.9 L87.4 30.9 L87.0 32.9 L86.7 34.8 L86.6 36.5 L86.9 38.0 L87.6 39.4 L88.6 40.7 L90.0 42.0 L91.5 43.4 L92.9 44.9 L94.1 46.5 L94.9 48.2Z"
            fill="currentColor"
            fill-opacity=".12"
            stroke="currentColor"
            stroke-width="1"
          />
          <g
            id="glyph"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></g>
        </svg>
        <h1
          id="title"
          class="mt-2 text-center font-display text-[32px] font-bold text-black"
        ></h1>
        <p
          id="subtitle"
          class="mx-auto mt-2 max-w-sm text-center text-slate-500"
        ></p>
        <div id="pay-box" hidden class="mt-4 text-center">
          <p id="countdown" class="font-display text-4xl font-bold text-black">
            05:00
          </p>
          <p id="pay-box-label" class="text-[11px] text-slate-400">
            Time left to pay
          </p>
        </div>
        <div id="rows" class="mt-4 border-t border-slate-300 pt-1.5"></div>
        <p
          id="note"
          class="mx-auto mt-8 max-w-xs text-center text-slate-500"
        ></p>
        <div class="mt-4 flex flex-wrap justify-center gap-4 sm:gap-6">
          <a
            id="act-home"
            href="../index.html"
            class="btn border-2 border-slate-400 bg-white px-6 py-2.5 text-base font-semibold text-slate-500 hover:bg-slate-500 hover:text-white"
            >Back to the home page</a
          >
          <button
            type="button"
            id="act-cancel"
            hidden
            class="btn border-2 border-red-600 bg-white px-6 py-2.5 text-base font-semibold text-red-600 hover:bg-red-600 hover:text-white"
          >
            Cancel Order
          </button>
          <a
            id="act-pay"
            href="payment.html"
            hidden
            class="btn btn-indigo px-6 py-2.5 text-base font-semibold"
            >Pay Now</a
          >
          <a
            id="act-again"
            href="order-form.html"
            hidden
            class="btn btn-indigo px-6 py-2.5 text-base font-semibold"
            >Order Again</a
          >
          <a
            id="act-extend"
            href="extend.html"
            hidden
            class="btn btn-indigo px-6 py-2.5 text-base font-semibold"
            >Extend rental</a
          >
          <a
            id="act-status"
            href="order-status.html"
            class="btn btn-indigo px-6 py-2.5 text-base font-semibold"
            >To Order Status</a
          >
        </div>
      </section>
    </main>
  </body>
</html>
