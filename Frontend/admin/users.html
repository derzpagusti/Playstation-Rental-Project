<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users - NovaPS Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/admin-users.css" />
    <script src="../js/shared/session.js"></script>
    <script
      src="../js/shared/admin.js"
      data-require-admin="login.html"
    ></script>
    <script src="../js/shared/orders.js" defer></script>
    <script src="../js/shared/admin-ui.js" defer></script>
    <script src="../js/admin-users.js" defer></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800">
    <header
      class="flex h-[68px] items-center justify-between bg-slate-900 px-4 md:px-[50px]"
    >
      <a
        href="dashboard.html"
        aria-label="NovaPS"
        class="group flex items-center gap-2.5 font-display text-2xl font-bold text-white transition-transform duration-150 active:scale-95"
      >
        <span
          class="grid size-[30px] place-items-center rounded-[7px] bg-cyan-400 transition-transform duration-300 ease-[cubic-bezier(.3,1.6,.5,1)] group-hover:-rotate-[8deg] group-hover:scale-110"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#0f172a"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="6" width="20" height="12" rx="3" />
            <path d="M6 12h4M8 10v4" />
            <circle cx="15.5" cy="11" r=".6" />
            <circle cx="17.5" cy="13" r=".6" /></svg
        ></span>
        Nova<span class="text-cyan-400">PS</span>
      </a>
      <div class="group relative">
        <button
          type="button"
          id="adminBtn"
          aria-haspopup="true"
          aria-expanded="false"
          class="btn btn-outline flex items-center gap-2 rounded-md px-4 py-1.5 text-lg font-normal"
        >
          Admin
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
          </svg>
        </button>
        <div
          class="invisible absolute right-0 top-[50px] z-30 min-w-[140px] -translate-y-1.5 rounded-lg bg-white p-1.5 opacity-0 shadow-xl transition-all duration-200 group-data-[open]:visible group-data-[open]:translate-y-0 group-data-[open]:opacity-100"
        >
          <a
            href="../index.html"
            class="block w-full rounded-md px-3 py-2 text-left text-[15px] font-medium text-slate-800 transition-colors hover:bg-slate-100"
            >View website</a
          >
          <button
            type="button"
            id="adminLogout"
            class="w-full cursor-pointer rounded-md px-3 py-2 text-left text-[15px] font-medium text-slate-800 transition-colors hover:bg-slate-100"
          >
            Logout
          </button>
        </div>
      </div>
    </header>
    <div class="md:grid md:grid-cols-[256px_1fr]">
      <aside class="bg-slate-900 md:min-h-[calc(100vh-68px)]">
        <nav
          aria-label="Admin menu"
          class="flex gap-1 overflow-x-auto p-3 md:flex-col md:p-6"
        >
          <a
            href="dashboard.html"
            class="block rounded-md px-4 py-2 text-base whitespace-nowrap text-slate-300 transition-all duration-150 hover:translate-x-0.5 hover:bg-white/10 hover:text-white active:scale-[.98] aria-[current=page]:bg-indigo-500 aria-[current=page]:font-semibold aria-[current=page]:text-white aria-[current=page]:hover:translate-x-0"
            >Dashboard</a
          >
          <a
            href="orders.html"
            class="block rounded-md px-4 py-2 text-base whitespace-nowrap text-slate-300 transition-all duration-150 hover:translate-x-0.5 hover:bg-white/10 hover:text-white active:scale-[.98] aria-[current=page]:bg-indigo-500 aria-[current=page]:font-semibold aria-[current=page]:text-white aria-[current=page]:hover:translate-x-0"
            >Orders</a
          >
          <a
            href="time-remaining.html"
            class="block rounded-md px-4 py-2 text-base whitespace-nowrap text-slate-300 transition-all duration-150 hover:translate-x-0.5 hover:bg-white/10 hover:text-white active:scale-[.98] aria-[current=page]:bg-indigo-500 aria-[current=page]:font-semibold aria-[current=page]:text-white aria-[current=page]:hover:translate-x-0"
            >Time Remaining</a
          >
          <a
            href="units.html"
            class="block rounded-md px-4 py-2 text-base whitespace-nowrap text-slate-300 transition-all duration-150 hover:translate-x-0.5 hover:bg-white/10 hover:text-white active:scale-[.98] aria-[current=page]:bg-indigo-500 aria-[current=page]:font-semibold aria-[current=page]:text-white aria-[current=page]:hover:translate-x-0"
            >Unit</a
          >
          <a
            href="users.html"
            class="block rounded-md px-4 py-2 text-base whitespace-nowrap text-slate-300 transition-all duration-150 hover:translate-x-0.5 hover:bg-white/10 hover:text-white active:scale-[.98] aria-[current=page]:bg-indigo-500 aria-[current=page]:font-semibold aria-[current=page]:text-white aria-[current=page]:hover:translate-x-0"
            aria-current="page"
            >Users</a
          >
        </nav>
      </aside>
      <main class="min-w-0 p-4 md:p-6">
        <h1 class="font-display text-[32px] font-bold text-slate-800">Users</h1>
        <section class="mt-5 rounded-lg bg-white p-6">
          <input
            type="search"
            id="search"
            placeholder="Search name, email or WhatsApp..."
            aria-label="Search users"
            class="field-input h-10"
          />
          <div class="mt-4 overflow-x-auto">
            <table class="w-full min-w-[820px] text-left">
              <thead id="users-head"></thead>
              <tbody id="users-body"></tbody>
            </table>
          </div>
          <p id="users-empty" hidden class="py-8 text-center text-slate-500">
            No users yet.
          </p>
          <p class="mt-4 text-xs text-slate-400">
            Demo: this list only contains accounts created or used in this
            browser. A real server will list everyone.
          </p>
        </section>
      </main>
    </div>
    <div
      id="userModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="userModalTitle"
      aria-hidden="true"
      class="group invisible fixed inset-0 z-50 grid place-items-center bg-slate-950/60 p-4 opacity-0 transition-all duration-200 data-[open]:visible data-[open]:opacity-100"
    >
      <div
        class="max-h-[92vh] w-full max-w-[580px] translate-y-4 scale-95 overflow-y-auto rounded-xl bg-white p-6 transition-transform duration-300 ease-[cubic-bezier(.2,.9,.3,1.2)] group-data-[open]:translate-y-0 group-data-[open]:scale-100"
      >
        <div class="flex items-start justify-between gap-4">
          <h2
            id="userModalTitle"
            class="font-display text-xl font-bold text-black"
          >
            User Detail
          </h2>
          <button
            type="button"
            data-close
            aria-label="Close"
            class="grid size-8 shrink-0 cursor-pointer place-items-center rounded-md text-slate-500 transition-all duration-150 hover:scale-110 hover:bg-slate-100 hover:text-slate-900 active:scale-90"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <div id="userBody" class="mt-3"></div>
        <div id="blockBox" hidden class="mt-4 rounded-md bg-red-50 p-3">
          <p class="text-sm font-medium text-red-800">
            Block this user? They are logged out, and cannot log in or order
            until you unblock them.
          </p>
          <label for="blockReason" class="mt-2 mb-0.5 block text-sm"
            >Note (optional)</label
          >
          <input
            type="text"
            id="blockReason"
            maxlength="120"
            placeholder="For your own record"
            class="field-input h-10"
          />
          <div class="mt-2 flex gap-2">
            <button
              type="button"
              id="cancelBlock"
              class="btn btn-ghost px-4 py-2 text-sm font-semibold"
            >
              Cancel
            </button>
            <button
              type="button"
              id="confirmBlock"
              class="btn bg-red-600 px-4 py-2 text-sm font-semibold text-white"
            >
              Block user
            </button>
          </div>
        </div>
        <div id="userActions" class="mt-5 flex justify-end"></div>
      </div>
    </div>
    <div
      id="toast"
      role="status"
      aria-live="polite"
      class="pointer-events-none fixed bottom-6 left-1/2 z-[60] -translate-x-1/2 translate-y-4 rounded-lg bg-slate-900 px-4 py-2.5 text-sm text-white opacity-0 shadow-lg transition-all duration-300 data-[open]:translate-y-0 data-[open]:opacity-100"
    ></div>
  </body>
</html>
