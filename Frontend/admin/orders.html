<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Orders - NovaPS Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/admin-orders.css" />
    <script src="../js/shared/session.js"></script>
    <script
      src="../js/shared/admin.js"
      data-require-admin="login.html"
    ></script>
    <script src="../js/shared/orders.js" defer></script>
    <script src="../js/shared/admin-ui.js" defer></script>
    <script src="../js/admin-orders.js" defer></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800">
    <header
      class="flex h-[68px] items-center justify-between bg-slate-900 px-4 md:px-[50px]"
    >
      <a
        href="dashboard.html"
        aria-label="NovaPS"
        class="group flex items-center gap-2.5 font-display text-2xl font-bold text-white transition-transform duration-150 active:scale-95"
      >
        <span
          class="grid size-[30px] place-items-center rounded-[7px] bg-cyan-400 transition-transform duration-300 ease-[cubic-bezier(.3,1.6,.5,1)] group-hover:-rotate-[8deg] group-hover:scale-110"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#0f172a"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="6" width="20" height="12" rx="3" />
            <path d="M6 12h4M8 10v4" />
            <circle cx="15.5" cy="11" r=".6" />
            <circle cx="17.5" cy="13" r=".6" /></svg
        ></span>
        Nova<span class="text-cyan-400">PS</span>
      </a>
      <div class="group relative">
        <button
          type="button"
          id="adminBtn"
          aria-haspopup="true"
          aria-expanded="false"
          class="btn btn-outline flex items-center gap-2 rounded-md px-4 py-1.5 text-lg font-normal"
        >
          Admin
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
          </svg>
        </button>
        <div
          class="invisible absolute right-0 top-[50px] z-30 min-w-[140px] -translate-y-1.5 rounded-lg bg-white p-1.5 opacity-0 shadow-xl transition-all duration-200 group-data-[open]:visible group-data-[open]:translate-y-0 group-data-[open]:opacity-100"
        >
          <a
            href="../index.html"
            class="block w-full rounded-md px-3 py-2 text-left text-[15px] font-medium text-slate-800 transition-colors hover:bg-slate-100"
            >View website</a
          >
          <button
            type="button"
            id="adminLogout"
            class="w-full cursor-pointer rounded-md px-3 py-2 text-left text-[15px] font-medium text-slate-800 transition-colors hover:bg-slate-100"
          >
            Logout
          </button>
        </div>
      </div>
    </header>
    <div class="md:grid md:grid-cols-[256px_1fr]">
      <aside class="bg-slate-900 md:min-h-[calc(100vh-68px)]">
        <nav
          aria-label="Admin menu"
          class="flex gap-1 overflow-x-auto p-3 md:flex-col md:p-6"
        >
          <a
            href="dashboard.html"
            class="block rounded-md px-4 py-2 text-base whitespace-nowrap text-slate-300 transition-all duration-150 hover:translate-x-0.5 hover:bg-white/10 hover:text-white active:scale-[.98] aria-[current=page]:bg-indigo-500 aria-[current=page]:font-semibold aria-[current=page]:text-white aria-[current=page]:hover:translate-x-0"
            >Dashboard</a
          >
          <a
            href="orders.html"
            class="block rounded-md px-4 py-2 text-base whitespace-nowrap text-slate-300 transition-all duration-150 hover:translate-x-0.5 hover:bg-white/10 hover:text-white active:scale-[.98] aria-[current=page]:bg-indigo-500 aria-[current=page]:font-semibold aria-[current=page]:text-white aria-[current=page]:hover:translate-x-0"
            aria-current="page"
            >Orders</a
          >
          <a
            href="time-remaining.html"
            class="block rounded-md px-4 py-2 text-base whitespace-nowrap text-slate-300 transition-all duration-150 hover:translate-x-0.5 hover:bg-white/10 hover:text-white active:scale-[.98] aria-[current=page]:bg-indigo-500 aria-[current=page]:font-semibold aria-[current=page]:text-white aria-[current=page]:hover:translate-x-0"
            >Time Remaining</a
          >
          <a
            href="units.html"
            class="block rounded-md px-4 py-2 text-base whitespace-nowrap text-slate-300 transition-all duration-150 hover:translate-x-0.5 hover:bg-white/10 hover:text-white active:scale-[.98] aria-[current=page]:bg-indigo-500 aria-[current=page]:font-semibold aria-[current=page]:text-white aria-[current=page]:hover:translate-x-0"
            >Unit</a
          >
          <a
            href="users.html"
            class="block rounded-md px-4 py-2 text-base whitespace-nowrap text-slate-300 transition-all duration-150 hover:translate-x-0.5 hover:bg-white/10 hover:text-white active:scale-[.98] aria-[current=page]:bg-indigo-500 aria-[current=page]:font-semibold aria-[current=page]:text-white aria-[current=page]:hover:translate-x-0"
            >Users</a
          >
        </nav>
      </aside>
      <main class="min-w-0 p-4 md:p-6">
        <h1 class="font-display text-[32px] font-bold text-slate-800">
          Manage Orders
        </h1>
        <section class="mt-5 rounded-lg bg-white p-6">
          <div class="flex flex-col gap-3 sm:flex-row">
            <input
              type="search"
              id="search"
              placeholder="Search name, email, WhatsApp or order ID..."
              aria-label="Search orders"
              class="field-input h-10 flex-1"
            />
            <select
              id="status-filter"
              aria-label="Filter by status"
              class="field-input h-10 sm:w-52"
            >
              <option value="all">All Status</option>
              <option value="not_paid">Not Paid</option>
              <option value="pending">Pending</option>
              <option value="shipped">Shipped</option>
              <option value="complete">Complete</option>
              <option value="canceled">Canceled</option>
              <option value="rejected">Rejected</option>
              <option value="returned">Returned</option>
              <option value="overdue">Returned (Overdue)</option>
            </select>
          </div>
          <div class="mt-4 overflow-x-auto">
            <table class="w-full min-w-[860px] text-left">
              <thead id="orders-head"></thead>
              <tbody id="orders-body"></tbody>
            </table>
          </div>
          <p id="orders-empty" hidden class="py-8 text-center text-slate-500">
            No orders found.
          </p>
          <div
            class="mt-4 flex flex-wrap items-center justify-between gap-3 text-sm text-slate-500"
          >
            <p id="orders-count" aria-live="polite"></p>
            <div class="flex items-center gap-2">
              <button
                type="button"
                id="prev-page"
                class="btn btn-mini btn-mini-blue"
              >
                Previous
              </button>
              <span id="page-label"></span>
              <button
                type="button"
                id="next-page"
                class="btn btn-mini btn-mini-blue"
              >
                Next
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div
      id="orderModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="orderModalTitle"
      aria-hidden="true"
      class="group invisible fixed inset-0 z-50 grid place-items-center bg-slate-950/60 p-4 opacity-0 transition-all duration-200 data-[open]:visible data-[open]:opacity-100"
    >
      <div
        class="max-h-[92vh] w-full max-w-[580px] translate-y-4 scale-95 overflow-y-auto rounded-xl bg-white p-6 transition-transform duration-300 ease-[cubic-bezier(.2,.9,.3,1.2)] group-data-[open]:translate-y-0 group-data-[open]:scale-100"
      >
        <div class="flex items-start justify-between gap-4">
          <h2
            id="orderModalTitle"
            class="font-display text-xl font-bold text-black"
          >
            Order Detail
          </h2>
          <button
            type="button"
            data-close
            aria-label="Close"
            class="grid size-8 shrink-0 cursor-pointer place-items-center rounded-md text-slate-500 transition-all duration-150 hover:scale-110 hover:bg-slate-100 hover:text-slate-900 active:scale-90"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <div id="orderBody" class="mt-3"></div>
        <div id="rejectBox" hidden class="mt-4 rounded-md bg-red-50 p-3">
          <label
            for="rejectReason"
            class="mb-0.5 block text-sm font-medium text-red-800"
            >Why is this order rejected?</label
          >
          <textarea
            id="rejectReason"
            rows="2"
            maxlength="200"
            placeholder="The customer will see this reason"
            class="field-input h-auto resize-none py-2"
          ></textarea>
          <p
            id="rejectError"
            role="alert"
            class="mt-0.5 text-[11px] text-red-600 empty:hidden"
          ></p>
          <button
            type="button"
            id="confirmReject"
            class="btn mt-2 bg-red-600 px-4 py-2 text-sm font-semibold text-white"
          >
            Confirm reject
          </button>
        </div>
        <div
          id="orderActions"
          class="mt-5 flex flex-wrap justify-end gap-3"
        ></div>
      </div>
    </div>
    <div
      id="toast"
      role="status"
      aria-live="polite"
      class="pointer-events-none fixed bottom-6 left-1/2 z-[60] -translate-x-1/2 translate-y-4 rounded-lg bg-slate-900 px-4 py-2.5 text-sm text-white opacity-0 shadow-lg transition-all duration-300 data-[open]:translate-y-0 data-[open]:opacity-100"
    ></div>
  </body>
</html>
